<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitchenOS — Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0a0f;--bg2:#12121a;--card:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--t1:#f0f0f5;--t2:#8a8a9a;--t3:#55556a;--acc:#6366f1;--accg:rgba(99,102,241,0.25);--grn:#22c55e;--red:#ef4444}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);height:100vh;display:flex;-webkit-font-smoothing:antialiased}
        /* Sidebar */
        .sidebar{width:260px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 16px}
        .sidebar-logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;padding:0 8px;margin-bottom:32px}
        .sidebar-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--acc),#a78bfa);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .sidebar-section{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;padding:0 8px;margin-bottom:12px}
        .sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s;text-decoration:none}
        .sidebar-item:hover{background:var(--card);color:var(--t1)}
        .sidebar-item.active{background:var(--accg);color:var(--acc)}
        .sidebar-spacer{flex:1}
        .sidebar-status{padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:12px}
        .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
        .status-dot.online{background:var(--grn);box-shadow:0 0 6px rgba(34,197,94,0.5)}
        .status-dot.offline{background:var(--red)}
        /* Main */
        .chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
        .chat-header{padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .chat-header-left{display:flex;align-items:center;gap:12px}
        .chat-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:18px}
        .chat-header-info h2{font-size:15px;font-weight:700}
        .chat-header-info p{font-size:12px;color:var(--t3)}
        .header-btn{padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
        .header-btn:hover{background:rgba(255,255,255,0.06);color:var(--t1)}
        /* Messages */
        .chat-messages{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:20px}
        .chat-messages::-webkit-scrollbar{width:4px}
        .chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
        .message{max-width:720px;animation:mi .3s ease-out}
        @keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .message.user{align-self:flex-end}
        .message.assistant{align-self:flex-start}
        .msg-bubble{padding:14px 18px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
        .message.user .msg-bubble{background:var(--acc);color:white;border-bottom-right-radius:4px}
        .message.assistant .msg-bubble{background:var(--card);border:1px solid var(--border);color:var(--t1);border-bottom-left-radius:4px}
        /* Typing indicator */
        .typing-bar{display:none;align-items:center;gap:10px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:360px;animation:mi .3s ease-out}
        .typing-bar.active{display:flex}
        .typing-dots{display:flex;gap:4px}
        .typing-dots span{width:6px;height:6px;background:var(--t3);border-radius:50%;animation:db 1.4s infinite}
        .typing-dots span:nth-child(2){animation-delay:.2s}
        .typing-dots span:nth-child(3){animation-delay:.4s}
        @keyframes db{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
        .typing-label{font-size:13px;color:var(--t3)}
        .typing-agent{color:var(--acc);font-weight:600}
        /* Welcome */
        .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
        .welcome-icon{font-size:48px;margin-bottom:16px}
        .welcome h2{font-size:22px;font-weight:700;margin-bottom:8px}
        .welcome p{font-size:14px;color:var(--t2);max-width:400px;line-height:1.6;margin-bottom:28px}
        .quick-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .quick-btn{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
        .quick-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--accg)}
        /* Input */
        .chat-input-bar{padding:16px 28px 24px;border-top:1px solid var(--border)}
        .input-wrapper{display:flex;gap:12px;align-items:flex-end}
        .input-field{flex:1;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--t1);font-size:14px;font-family:'Inter',sans-serif;resize:none;outline:none;max-height:120px;transition:border-color .2s}
        .input-field::placeholder{color:var(--t3)}
        .input-field:focus{border-color:rgba(99,102,241,0.4)}
        .send-btn{width:48px;height:48px;flex-shrink:0;background:var(--acc);border:none;border-radius:14px;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 4px 16px var(--accg)}
        .send-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px var(--accg)}
        .send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
        @media(max-width:768px){.sidebar{display:none}}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-logo"><div class="sidebar-logo-icon">🥘</div><span>KitchenOS</span></div>
    <div class="sidebar-section">Navigation</div>
    <a href="/" class="sidebar-item">🏠 Home</a>
    <a href="/chat" class="sidebar-item active">💬 Chat</a>
    <div class="sidebar-section" style="margin-top:24px">Quick Commands</div>
    <div class="sidebar-item quick-cmd" data-cmd="Dinner for the family tonight">🍽️ Family Dinner</div>
    <div class="sidebar-item quick-cmd" data-cmd="What's expiring soon in the pantry?">⏰ Expiring Items</div>
    <div class="sidebar-item quick-cmd" data-cmd="What's the price of milk on Swiggy?">🥛 Price Check</div>
    <div class="sidebar-item quick-cmd" data-cmd="Show me my family's dietary profiles">👨‍👩‍👧 Profiles</div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-status"><span class="status-dot offline" id="status-dot"></span><span id="status-text">Connecting...</span></div>
</aside>

<main class="chat-main">
    <div class="chat-header">
        <div class="chat-header-left">
            <div class="chat-avatar">👨‍🍳</div>
            <div class="chat-header-info"><h2>Chef</h2><p id="session-label">Starting session...</p></div>
        </div>
        <button class="header-btn" id="btn-new-session">+ New Session</button>
    </div>

    <div class="chat-messages" id="messages">
        <div class="welcome" id="welcome-screen">
            <div class="welcome-icon">👨‍🍳</div>
            <h2>Welcome to KitchenOS</h2>
            <p>I'm your Chef. Tell me what you need and I'll coordinate the agents to get it done.</p>
            <div class="quick-actions">
                <button class="quick-btn" data-cmd="Dinner for the family tonight">🍽️ Family Dinner</button>
                <button class="quick-btn" data-cmd="What's in the pantry?">📦 Pantry Audit</button>
                <button class="quick-btn" data-cmd="What's the price of milk?">💰 Price Check</button>
            </div>
        </div>
        <div class="typing-bar" id="typing-bar">
            <div class="typing-dots"><span></span><span></span><span></span></div>
            <div class="typing-label"><span class="typing-agent" id="typing-agent">Chef</span> is working...</div>
        </div>
    </div>

    <div class="chat-input-bar">
        <div class="input-wrapper">
            <textarea class="input-field" id="user-input" placeholder="Tell the Chef what you need..." rows="1"></textarea>
            <button class="send-btn" id="send-btn" disabled>↑</button>
        </div>
    </div>
</main>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const welcomeScreen = document.getElementById('welcome-screen');
const sessionLabel = document.getElementById('session-label');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const typingBar = document.getElementById('typing-bar');
const typingAgent = document.getElementById('typing-agent');

let sessionId = null;
let isStreaming = false;

// Agent display names
const AGENT_NAMES = { Chef: 'Chef', Diet: 'Diet', Recipe: 'Recipe', Shopper: 'Shopper', Budget: 'Budget' };

async function createSession() {
    try {
        const resp = await fetch('/api/session', { method: 'POST' });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        sessionId = data.session_id;
        sessionLabel.textContent = 'Session: ' + sessionId.slice(0, 8) + '…';
        statusDot.className = 'status-dot online';
        statusText.textContent = 'Connected to ADK';
        sendBtn.disabled = false;
    } catch (e) {
        statusDot.className = 'status-dot offline';
        statusText.textContent = 'ADK offline';
        sessionLabel.textContent = 'Could not connect';
    }
}

function addMessage(role, text) {
    if (welcomeScreen && welcomeScreen.parentNode) welcomeScreen.remove();
    const wrapper = document.createElement('div');
    wrapper.className = 'message ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    wrapper.appendChild(bubble);
    // Insert before typing bar
    messagesEl.insertBefore(wrapper, typingBar);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
}

function showTyping(agent) {
    typingAgent.textContent = AGENT_NAMES[agent] || agent || 'Chef';
    typingBar.classList.add('active');
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
    typingBar.classList.remove('active');
}

async function sendMessage(text) {
    if (!text.trim() || !sessionId || isStreaming) return;
    isStreaming = true;
    sendBtn.disabled = true;

    addMessage('user', text.trim());
    inputEl.value = '';
    inputEl.style.height = 'auto';
    showTyping('Chef');

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId, message: text.trim() }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        // We collect ALL text parts but only show the LAST agent's final text
        let allParts = [];  // { agent, text }
        let lastSeenAgent = 'Chef';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const jsonStr = line.slice(6).trim();
                if (!jsonStr || jsonStr === '[DONE]') continue;

                try {
                    const evt = JSON.parse(jsonStr);
                    const author = evt.author || evt.agent || null;

                    // Update the typing indicator with the current working agent
                    if (author && author !== lastSeenAgent) {
                        lastSeenAgent = author;
                        showTyping(author);
                    }

                    // Collect text parts
                    let textPart = '';
                    if (evt.content && evt.content.parts) {
                        for (const p of evt.content.parts) {
                            if (p.text) textPart += p.text;
                        }
                    }
                    if (textPart && author) {
                        allParts.push({ agent: author, text: textPart });
                    }
                } catch (e) { /* ignore non-JSON */ }
            }
        }

        hideTyping();

        // Show only the FINAL response (last text from the root Chef agent, or last text overall)
        // Strategy: find the last chunk from 'Chef', otherwise use the very last chunk
        let finalText = '';
        for (let i = allParts.length - 1; i >= 0; i--) {
            if (allParts[i].agent === 'Chef') {
                // Collect all consecutive Chef parts from the end
                let chefParts = [];
                for (let j = i; j >= 0 && allParts[j].agent === 'Chef'; j--) {
                    chefParts.unshift(allParts[j].text);
                }
                finalText = chefParts.join('');
                break;
            }
        }
        // Fallback: if no Chef response, use the very last part
        if (!finalText && allParts.length > 0) {
            finalText = allParts[allParts.length - 1].text;
        }

        if (finalText) {
            addMessage('assistant', finalText);
        } else {
            addMessage('assistant', 'Done. The agents have completed processing.');
        }

    } catch (e) {
        hideTyping();
        addMessage('assistant', 'Connection error: ' + e.message);
    }

    isStreaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
}

// Events
sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(inputEl.value); } });
inputEl.addEventListener('input', () => { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px'; });

document.querySelectorAll('.quick-btn, .quick-cmd').forEach(btn => {
    btn.addEventListener('click', () => { if (btn.dataset.cmd) sendMessage(btn.dataset.cmd); });
});

document.getElementById('btn-new-session').addEventListener('click', () => {
    // Reset
    const nodes = messagesEl.querySelectorAll('.message');
    nodes.forEach(n => n.remove());
    const w = document.createElement('div');
    w.className = 'welcome'; w.id = 'welcome-screen';
    w.innerHTML = '<div class="welcome-icon">👨‍🍳</div><h2>Welcome to KitchenOS</h2><p>I\'m your Chef. Tell me what you need.</p><div class="quick-actions"><button class="quick-btn" data-cmd="Dinner for the family tonight">🍽️ Family Dinner</button><button class="quick-btn" data-cmd="What\'s in the pantry?">📦 Pantry</button><button class="quick-btn" data-cmd="What\'s the price of milk?">💰 Price</button></div>';
    messagesEl.insertBefore(w, typingBar);
    w.querySelectorAll('.quick-btn').forEach(b => b.addEventListener('click', () => sendMessage(b.dataset.cmd)));
    createSession();
});

createSession();
</script>
</body>
</html>
